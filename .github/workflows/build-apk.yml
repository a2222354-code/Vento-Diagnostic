name: Build Android APK (KW1281 Diag)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 5. Build Debug APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          echo "Working directory: $(pwd)"
          gradle assembleDebug --stacktrace --no-daemon

      - name: 6. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kw1281-vento-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
